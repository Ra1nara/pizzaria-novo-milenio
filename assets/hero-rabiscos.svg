<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" fill="none" stroke="#7A5A40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Desenhos de traço fino para o fundo do hero (usados com opacidade baixa).
       Pizza inteira, fatias, folhas de manjericão, tomate, cogumelo, azeitonas e ervas. -->
  <defs>
    <g id="pizza">
      <circle r="100"/>
      <circle r="84"/>
      <path d="M0-84V84M-72.7-42 72.7 42M-72.7 42 72.7-42"/>
      <circle cx="-30" cy="-46" r="11"/><circle cx="34" cy="-30" r="11"/><circle cx="-48" cy="14" r="11"/>
      <circle cx="12" cy="44" r="11"/><circle cx="50" cy="20" r="9"/><circle cx="-14" cy="-6" r="9"/>
      <circle cx="-8" cy="58" r="4"/><circle cx="58" cy="-52" r="4"/><circle cx="-62" cy="-20" r="4"/>
      <path d="M22-62c4 3 8 3 12 0M-60 46c3 4 7 5 11 3M40 56c2 4 6 6 10 5"/>
    </g>
    <g id="fatia">
      <path d="M0 0 120-26C126-8 124 10 116 26Z"/>
      <path d="M120-26c10 4 14 30 4 50-4 8-10 8-12 2"/>
      <circle cx="58" cy="-2" r="8"/><circle cx="88" cy="6" r="7"/><circle cx="84" cy="-14" r="5"/>
      <path d="M36 10c2 8 2 14-2 20M70 18c1 6 0 10-3 14"/>
    </g>
    <g id="folha">
      <path d="M0 0C20-30 62-36 90-18 66 8 26 18 0 0Z"/>
      <path d="M0 0C30-8 58-12 90-18M28-6l8-12M44-10l10-12M60-13l10-10M30-4l10 8M48-8l10 8M64-11l9 7"/>
      <path d="M0 0-14 8"/>
    </g>
    <g id="tomate">
      <circle r="34"/><circle r="26"/>
      <path d="M0-26V26M-22-13 22 13M-22 13 22-13"/>
      <ellipse cx="-11" cy="-12" rx="3" ry="5" transform="rotate(30 -11 -12)"/>
      <ellipse cx="11" cy="-12" rx="3" ry="5" transform="rotate(-30 11 -12)"/>
      <ellipse cx="-15" cy="3" rx="3" ry="5" transform="rotate(90 -15 3)"/>
      <ellipse cx="15" cy="3" rx="3" ry="5" transform="rotate(90 15 3)"/>
      <ellipse cx="0" cy="16" rx="3" ry="5"/>
    </g>
    <g id="cogumelo">
      <path d="M-34 0C-34-26-18-40 0-40S34-26 34 0Z"/>
      <path d="M-12 0c-2 14-4 24-2 30h28c2-6 0-16-2-30"/>
      <path d="M-16-22a4 4 0 1 0 0 .1M10-28a3 3 0 1 0 0 .1M18-12a3 3 0 1 0 0 .1"/>
    </g>
    <g id="azeitonas">
      <ellipse cx="0" cy="0" rx="14" ry="10" transform="rotate(-20)"/>
      <ellipse cx="-2" cy="-1" rx="4" ry="3" transform="rotate(-20)"/>
      <ellipse cx="26" cy="12" rx="14" ry="10" transform="rotate(15 26 12)"/>
      <ellipse cx="25" cy="11" rx="4" ry="3" transform="rotate(15 26 12)"/>
      <path d="M-30-30c16 8 30 14 48 16M-14-22c-6-10-4-18 4-22M4-17c2-10 8-16 16-16"/>
    </g>
    <g id="ervas">
      <path d="M0 0l6-4M14 8l4 5M-10 14l-5 3M24-6l6-1M30 16l3 5M-4-14l-2-6"/>
    </g>
  </defs>

  <!-- canto superior esquerdo, cortado pela borda -->
  <use href="#pizza" transform="translate(40 30) scale(1.05) rotate(12)"/>
  <use href="#ervas" transform="translate(190 46)"/>
  <!-- lateral esquerda -->
  <use href="#folha" transform="translate(-20 330) rotate(-28) scale(1.1)"/>
  <use href="#fatia" transform="translate(-30 590) rotate(-14) scale(1.15)"/>
  <use href="#tomate" transform="translate(150 680) rotate(10)"/>
  <use href="#ervas" transform="translate(120 470) rotate(40)"/>
  <!-- centro superior (entre o texto e a pizza) -->
  <use href="#fatia" transform="translate(560 120) rotate(152) scale(.95)"/>
  <use href="#folha" transform="translate(700 210) rotate(18) scale(.8)"/>
  <use href="#ervas" transform="translate(640 300) rotate(-20)"/>
  <use href="#azeitonas" transform="translate(760 560) rotate(-10)"/>
  <use href="#ervas" transform="translate(470 520) rotate(70)"/>
  <!-- lado direito: atrás da pizza (aparecem nas bordas e no topo) -->
  <use href="#pizza" transform="translate(1210 40) scale(.8) rotate(-18)"/>
  <use href="#cogumelo" transform="translate(1010 92) rotate(-12)"/>
  <use href="#folha" transform="translate(1470 230) rotate(-60) scale(.9)"/>
  <use href="#tomate" transform="translate(1560 90) rotate(-20)"/>
  <use href="#ervas" transform="translate(1380 140) rotate(15)"/>
  <use href="#fatia" transform="translate(1520 420) rotate(200) scale(1.05)"/>
</svg>
